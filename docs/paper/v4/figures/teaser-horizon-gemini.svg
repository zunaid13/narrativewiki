    <line x1="22" y1="133" x2="212" y2="133" stroke="#64748B" stroke-width="1.0" stroke-dasharray="3,2" />
    <text x="25" y="129" class="sans-tiny" fill="#64748B">1-call page budget ceiling (~1k words)</text>
