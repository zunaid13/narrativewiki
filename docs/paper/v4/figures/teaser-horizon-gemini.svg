    <path d="M 204,282 C 145,295 75,295 32,283" fill="none" stroke="#D81B60" stroke-width="1.1" stroke-dasharray="2.5,1.5" marker-end="url(#arr-magenta)" />
    <text x="82" y="285" class="sans-badge" fill="#BE123C">3. v1 identity drift: 39%</text>
    <polyline fill="none" stroke="#334155" stroke-width="0.7" points="204,205 245,205 262,205" />
    <text x="267" y="207" class="call-head" fill="#1E1B4B">NarrativeWiki (B5)</text>
    <text x="267" y="220" class="call-body" fill="#475569">Accumulates claims; loses context</text>
    <text x="267" y="233" class="call-metric" fill="#1E1B4B">central .86 → <tspan font-weight="bold">.95</tspan> · <tspan font-weight="bold">1 lost</tspan> · 3.8× facts</text>
    <text x="267" y="246" class="call-metric" fill="#0E8795">B4 same graph: <tspan font-weight="bold">.965</tspan> prec · <tspan font-weight="bold">.915</tspan> cite</text>
    <text x="267" y="259" class="call-metric" fill="#D81B60">pair context .71 · modality 4/220</text>
