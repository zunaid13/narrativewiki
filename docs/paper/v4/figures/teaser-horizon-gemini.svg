    <path d="M 160,84 C 142,32 78,32 58,78" fill="none" stroke="#D81B60" stroke-width="1.7" marker-end="url(#arr-magenta)" />
    <path d="M 204,84 C 175,18 68,18 38,78" fill="none" stroke="#D81B60" stroke-width="1.4" stroke-dasharray="3,1.5" marker-end="url(#arr-magenta)" />
    <circle cx="116" cy="84" r="2.5" fill="#D81B60" />
    <circle cx="160" cy="84" r="2.5" fill="#D81B60" />
    <circle cx="204" cy="84" r="2.5" fill="#D81B60" />
    <rect x="102" y="25" width="86" height="13" rx="2.5" fill="#FFE4E6" stroke="#D81B60" stroke-width="0.8" />
    <text x="145" y="34" class="sans-badge" fill="#BE123C" text-anchor="middle">X2: 23/220 leaks</text>
    <polyline fill="none" stroke="#334155" stroke-width="0.7" points="188,31 245,31 262,31" />
    <text x="267" y="33" class="call-head" fill="#6C5CE7">Prompt &amp; memory (X2, X1)</text>
    <text x="267" y="46" class="call-body" fill="#475569">Treated control strips recognition</text>
    <text x="267" y="59" class="call-metric" fill="#6C5CE7">X1 recall .68 → .003 <tspan fill="#D81B60" font-weight="bold">· 23/220 leaks</tspan></text>
