<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 435 328" width="100%" height="100%">
  <defs>
    <style>
      .serif-italic { font-family: "Linux Libertine O", "Times New Roman", Georgia, serif; font-style: italic; font-size: 10px; fill: #334155; }
      .serif-axis   { font-family: "Linux Libertine O", "Times New Roman", Georgia, serif; font-size: 10px; fill: #1E293B; }
      .sans-tiny    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 8px; fill: #475569; }
      .sans-badge   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 7.5px; font-weight: 700; }
      .call-head    { font-family: "Linux Libertine O", "Times New Roman", Georgia, serif; font-size: 11px; font-weight: bold; }
      .call-body    { font-family: "Linux Libertine O", "Times New Roman", Georgia, serif; font-size: 9.8px; }
      .call-metric  { font-family: "Linux Libertine O", "Times New Roman", Georgia, serif; font-size: 9.8px; }
    </style>
    <marker id="arr-magenta" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#D81B60" />
    </marker>
    <marker id="arr-violet" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#6C5CE7" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#0E8795" />
    </marker>
    <linearGradient id="grad-indigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0E8795" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="grad-teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E8795" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#0E8795" stop-opacity="0.06" />
    </linearGradient>
  </defs>
  <rect width="435" height="328" fill="#FFFFFF" />
  <g id="shared-volume-guides">
    <rect x="94" y="18" width="126" height="274" fill="#FFF1F2" fill-opacity="0.55" />
    <line x1="28" y1="18" x2="28" y2="292" stroke="#E2E8F0" stroke-width="0.8" />
    <line x1="72" y1="18" x2="72" y2="292" stroke="#E2E8F0" stroke-width="0.8" />
