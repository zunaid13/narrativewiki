    <line x1="204" y1="18" x2="204" y2="292" stroke="#E2E8F0" stroke-width="0.8" />
    <text x="58" y="13" class="serif-italic" text-anchor="middle">eligible prefix (D≤t)</text>
    <text x="157" y="13" class="serif-italic" fill="#9F1239" text-anchor="middle">unread future (r(g) > t)</text>
    <line x1="94" y1="15" x2="94" y2="295" stroke="#D81B60" stroke-width="1.4" stroke-dasharray="4,2.5" />
  </g>
