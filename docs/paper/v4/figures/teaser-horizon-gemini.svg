    <path d="M 116,143 C 132,158 142,168 154,175" fill="none" stroke="#D81B60" stroke-width="1.1" stroke-dasharray="2,1.5" />
    <circle cx="154" cy="175" r="2.2" fill="#FFFFFF" stroke="#D81B60" stroke-width="1.1" />
    <path d="M 160,145 C 174,159 184,168 196,175" fill="none" stroke="#D81B60" stroke-width="1.1" stroke-dasharray="2,1.5" />
    <circle cx="196" cy="175" r="2.2" fill="#FFFFFF" stroke="#D81B60" stroke-width="1.1" />
    <text x="155" y="168" class="sans-badge" fill="#D81B60" text-anchor="middle">10–24 facts evicted (t → t+1)</text>
    <ellipse cx="94" cy="134.5" rx="26" ry="8" transform="rotate(21 94 134.5)" fill="#0E8795" fill-opacity="0.08" stroke="#0E8795" stroke-width="0.9" />
    <polyline fill="none" stroke="#334155" stroke-width="0.7" points="204,142 245,125 262,125" />
    <text x="267" y="127" class="call-head" fill="#0E8795">Budgeted rewrite (B1–B4)</text>
    <text x="267" y="140" class="call-body" fill="#475569">Prefix-safe, but evicts early facts</text>
    <text x="267" y="153" class="call-metric" fill="#0E8795">central 1.00 → .76 · <tspan fill="#D81B60" font-weight="bold">14 lost (B1, B4)</tspan></text>
    <text x="267" y="166" class="call-metric" fill="#64748B">B1 treated citations: .88 → <tspan fill="#D81B60" font-weight="bold">.30</tspan></text>
  </g>
