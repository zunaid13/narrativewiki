facts:
  - text: "Holo is a nonhuman wolf spirit who lived in and watched over the wheat harvest at Pasloe for centuries."
    in_scope: true
  - text: "Holo is originally from Yoitsu, in the north."
    in_scope: true
  - text: "Holo can take two forms: her true form is a giant wolf, and she also appears as a human woman."
    in_scope: true
  - text: "Holo's wolf form has wheat-brown fur on the upper half of her body and off-white fur on the rest."
    in_scope: true
  - text: "In human form Holo looks like a girl of about fifteen, with long flowing brown hair, wolf ears, and a tail with a white tip."
    in_scope: true
  - text: "Holo has fangs for canine teeth."
    in_scope: true
  - text: "Holo escaped Pasloe by hiding in the wheat on the traveling merchant Kraft Lawrence's cart and joined him on his travels."
    in_scope: true
  - text: "Holo is jovial, loquacious, smart, and confident, especially around Lawrence."
    in_scope: true
  - text: "Holo speaks in an old-fashioned, formal register and rarely uses contractions."
    in_scope: true
  - text: "Holo is flirtatious and manipulative toward Lawrence, and often mocks his business/negotiating skills."
    in_scope: true
  - text: "Holo and Lawrence eventually settle in Nyohhira, open the Spice and Wolf bathhouse, and marry."
    in_scope: false  # far-future/epilogue-era fact (the sequel series), well beyond Volume 2
  - text: "Holo harbors a deep fear of solitude, which is part of why she bonds so strongly with Lawrence."
    in_scope: false  # plausible by v2 but not confidently placeable to a specific volume; excluded conservatively
  - text: "Holo is willing to reveal her true wolf form to protect Lawrence, despite the risk."
    in_scope: false  # uncertain which volume this specific act occurs in; excluded conservatively
  - text: "Holo snores in her sleep but denies it when told."
    in_scope: false  # trivia, not tied to a specific volume; cannot verify it's established by v2

