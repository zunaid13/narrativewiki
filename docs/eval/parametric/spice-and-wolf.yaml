# Phase 32 multi-cutoff gold for Spice and Wolf, volumes 1-5 (plan 0011 S6).
# Hand-written 2026-09-27 from what each volume's text establishes; every `evidence` para_id was
# found by search and its paragraph read (data/spice-and-wolf/01_parsed/v0N.jsonl). A fact's
# volume is its evidence id's volume: at cutoff t it is a `control` fact (should be on the page,
# recall) when first_vol <= t and a `future` fact (must not be, leak) when first_vol > t.
# Scored by scripts/eval/pipeline_page_leak.py (MiniCheck + lexical markers, then read by hand).
# `keywords` are lexical markers of a later fact; ones already in the volumes <= t text are
# dropped at run time. Character keys must equal the gazetteer's canonical names.
series: spice-and-wolf
characters:
  Holo:
    facts:
      - {claim: "Holo is a wolf spirit who lives in the wheat of Pasloe's harvest.", evidence: v01:c01:p0321}
      - {claim: "Holo calls herself Holo the Wisewolf.", evidence: v01:c01:p0315}
      - {claim: "Holo comes from Yoitsu, a place in the north, and wants to know how it is.", evidence: v01:c01:p0215}
      - {claim: "Holo takes her true form as a giant wolf to protect Lawrence underground.", evidence: v01:c07:p0037}
      - {claim: "Holo suggests smuggling gold into Ruvinheigen.", evidence: v02:c03:p0573, keywords: ["smuggling in gold", "smuggle gold"]}
      - {claim: "Amati proposes marriage to Holo.", evidence: v03:c02:p0045, keywords: ["Amati", "proposal of marriage"]}
      - {claim: "Holo's homeland Yoitsu is said to have been destroyed by the Moon-Hunting Bear.", evidence: v03:c01:p0508, keywords: ["Moon-Hunting Bear", "bear spirit"]}
