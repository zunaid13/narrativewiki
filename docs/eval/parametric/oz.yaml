# Marvelous Land, Ozma of Oz, Dorothy and the Wizard, Road to Oz). Same format as anne.yaml: a
# fact's reveal volume is its evidence paragraph's volume, so one file serves every cutoff t
# (`future` at t when first_vol > t, `control` otherwise).
#
# READER: agent-drafted 2026-09-28 (claude-opus-5-5), NOT a human annotation (plan 0014 D1 pilot
# path). Every `evidence` id was found by a text search over data/oz/01_parsed/v0N.jsonl and the
# paragraph read before the fact was written; facts were chosen from the text, never from any
# pipeline output (no LLM stage has run on Oz — plan 0012 D16). Needs the maintainer's review.
#
# OPEN before scoring: character keys must equal the gazetteer's canonical names (pages are looked
# up by slug). Oz has no gazetteer until the frozen build (S03); reconcile these keys with it then
# (e.g. "Wizard of Oz" vs "Oz", "Tip" vs "Ozma" — Tip IS Ozma, revealed in v2: the delayed-identity
# case, kept as two keys here so each volume's naming can be scored).
# `keywords`: lexical markers of the later fact; one that also occurs in the text up to t is
# dropped at run time (valid_keywords), so a generic word only counts where it is new.
